[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andy Khramtsov", email = "" }
]
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.18.4",
    "dash>=4.1.0",
    "dash-ag-grid>=33.3.3",
    "litestar>=2.21.1",
    "numpy>=2.4.3",
    "polars>=1.39.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "jupyter>=1.1.1",
    "jupyterlab-vim>=4.1.4",
    "pytest>=9.0.2",
    "rich>=14.3.3",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
